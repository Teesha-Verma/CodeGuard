<!DOCTYPE html>
<html lang="en" class="dark h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CodeGuard V2 — Security-Focused Code Review Platform</title>
    <meta
      name="description"
      content="Enterprise hybrid static-analysis and LLM reasoning code review engine for GitHub Pull Requests and Python code."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      try {
        const theme = localStorage.getItem('codeguard_theme');
        if (theme === 'light') {
          document.documentElement.classList.remove('dark');
        } else {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    </script>
  </head>
  <body class="min-h-full flex flex-col bg-[#fbfcfd] dark:bg-[#0a0d14] text-slate-900 dark:text-slate-100 antialiased">
    <div id="root" class="min-h-full flex flex-col flex-1"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
